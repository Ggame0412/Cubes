# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'adopt'
        cache: gradle

    - name: Setup Android SDK
      run: ./android/travis_androidsdk.sh

    - name: Print versions
      run: |
        java -version
        ./gradlew --version
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        find $ANDROID_HOME/ndk -maxdepth 2 -type d || true

    - name: Build with Gradle
      run: ./gradlew buildAll   # или ./gradlew ciPublish, если нужно публиковать
      # env:
      #  MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      #  MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}

    - name: Sort build outputs into staging folders
      run: |
        mkdir -p staging/android staging/jar staging/exe staging/other

        # APK — всё, что относится к Android
        find . -type f -name "*.apk" -exec cp {} staging/android/ \;

        # JAR — desktop/server сборки и т.п.
        find . -type f -name "*.jar" -exec cp {} staging/jar/ \;

        # EXE — Windows-сборки (если есть)
        find . -type f -name "*.exe" -exec cp {} staging/exe/ \;

        # Всё остальное, что может пригодиться (например AAB, mapping.txt, natives и т.д.)
        find . -type f \( -name "*.aab" -o -name "mapping.txt" \) -exec cp {} staging/other/ \; || true

        echo "== Staged files =="
        find staging -type f | sort

    - name: Upload Android APKs
      uses: actions/upload-artifact@v4
      with:
        name: cubes-android
        path: staging/android/*
        if-no-files-found: warn

    - name: Upload JARs
      uses: actions/upload-artifact@v4
      with:
        name: cubes-jar
        path: staging/jar/*
        if-no-files-found: warn

    - name: Upload EXEs
      uses: actions/upload-artifact@v4
      with:
        name: cubes-exe
        path: staging/exe/*
        if-no-files-found: warn

    - name: Upload other files
      uses: actions/upload-artifact@v4
      with:
        name: cubes-other
        path: staging/other/*
        if-no-files-found: ignore